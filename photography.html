<body class="gallery">
  <nav class="site-nav">
    <a href="/">← Bryce Glacken</a>
  </nav>

  <header class="photo-header">
    <h1>Photography</h1>
  </header>

  <main>
    <div class="photo-grid">
      <!-- Justified rows: each photo's aspect ratio (--r = width/height) lets
           CSS size the rows to fill the width with no gaps and no cropping. -->
      <img src="/images/photo-2.jpg"  alt="" loading="lazy" style="--r: 1.33">
      <img src="/images/photo-9.jpg"  alt="" loading="lazy" style="--r: 0.80">
      <img src="/images/photo-5.jpg"  alt="" loading="lazy" style="--r: 1.78">
      <img src="/images/photo-3.jpg"  alt="" loading="lazy" style="--r: 1.50">
      <img src="/images/photo-1.jpg"  alt="" loading="lazy" style="--r: 2.71">
      <img src="/images/photo-8.jpg"  alt="" loading="lazy" style="--r: 1.33">
      <img src="/images/photo-12.jpg" alt="" loading="lazy" style="--r: 1.78">
      <img src="/images/photo-4.jpg"  alt="" loading="lazy" style="--r: 1.50">
      <img src="/images/photo-15.jpg" alt="" loading="lazy" style="--r: 2.35">
      <img src="/images/photo-10.jpg" alt="" loading="lazy" style="--r: 1.50">
      <img src="/images/photo-6.jpg"  alt="" loading="lazy" style="--r: 1.50">
      <img src="/images/photo-11.jpg" alt="" loading="lazy" style="--r: 3.00">
      <img src="/images/photo-13.jpg" alt="" loading="lazy" style="--r: 1.50">
      <img src="/images/photo-14.jpg" alt="" loading="lazy" style="--r: 2.70">
    </div>
