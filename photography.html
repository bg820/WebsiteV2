<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography — Bryce Glacken</title>
  <meta name="description" content="Landscape and street photography by Bryce Glacken.">
  <meta property="og:title" content="Photography — Bryce Glacken">
  <meta property="og:description" content="Landscape and street photography by Bryce Glacken.">
  <meta property="og:url" content="https://bryceglacken.com/photography/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://bryceglacken.com/images/hero.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Serif+Display:ital@0;1&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Serif+Display:ital@0;1&display=swap"></noscript>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="gallery">
  <nav class="site-nav">
    <a href="/">← Bryce Glacken</a>
  </nav>

  <header class="photo-header">
    <h1>Photography</h1>
  </header>

  <main>
    <div class="photo-grid">
      <!-- Panoramas (photo-1, photo-15, photo-11, photo-14) are spaced apart so
           they never stack directly; mixed aspect ratios sit between them. -->
      <img src="/images/photo-2.jpg" alt="" loading="lazy">
      <img src="/images/photo-9.jpg" alt="" loading="lazy">
      <img src="/images/photo-5.jpg" alt="" loading="lazy">
      <img src="/images/photo-3.jpg" alt="" loading="lazy">
      <img src="/images/photo-1.jpg" alt="" loading="lazy">
      <img src="/images/photo-8.jpg" alt="" loading="lazy">
      <img src="/images/photo-12.jpg" alt="" loading="lazy">
      <img src="/images/photo-4.jpg" alt="" loading="lazy">
      <img src="/images/photo-15.jpg" alt="" loading="lazy">
      <img src="/images/photo-10.jpg" alt="" loading="lazy">
      <img src="/images/photo-6.jpg" alt="" loading="lazy">
      <img src="/images/photo-11.jpg" alt="" loading="lazy">
      <img src="/images/photo-13.jpg" alt="" loading="lazy">
      <img src="/images/photo-7.jpg" alt="" loading="lazy">
      <img src="/images/photo-14.jpg" alt="" loading="lazy">
    </div>
  </main>

  <footer>
    <span>© 2026 Bryce Glacken</span>
  </footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <img src="" alt="">
  </div>

  <script>
    (function () {
      const lb = document.getElementById('lightbox');
      const lbImg = lb.querySelector('img');

      document.querySelectorAll('.photo-grid img').forEach(function (img) {
        // Panoramic photos (much wider than tall) span the full row
        function checkWide() {
          if (img.naturalWidth && img.naturalHeight &&
              img.naturalWidth / img.naturalHeight >= 2) {
            img.classList.add('wide');
          }
        }
        if (img.complete) checkWide();
        else img.addEventListener('load', checkWide);

        img.addEventListener('click', function () {
          lbImg.src = img.src;
          lb.classList.add('open');
          lb.setAttribute('aria-hidden', 'false');
          document.body.style.overflow = 'hidden';
        });
      });

      function close() {
        lb.classList.remove('open');
        lb.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      lb.addEventListener('click', close);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') close();
      });
    })();
  </script>
</body>
</html>
